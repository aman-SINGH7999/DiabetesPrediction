<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diabetes Prediction</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <div class="container">

      <div class="card">

          <h1>🩺 Diabetes Prediction</h1>
          <p class="subtitle">
              Enter patient details to predict diabetes risk
          </p>

          <form action="/predict" method="POST">

              <div class="grid">

                  <input 
                    type="number" 
                    name="Pregnancies" 
                    value="{{ Pregnancies if Pregnancies else '' }}"
                    placeholder="Pregnancies" 
                    required
                  >

                  <input 
                    type="number" 
                    name="Glucose" 
                    value="{{ Glucose if Glucose else '' }}"
                    placeholder="Glucose" 
                    required
                  >

                  <input 
                    type="number" 
                    name="BloodPressure" 
                    value="{{ BloodPressure if BloodPressure else '' }}"
                    placeholder="Blood Pressure" 
                    required
                  >

                  <input 
                    type="number" 
                    name="SkinThickness" 
                    value="{{ SkinThickness if SkinThickness else '' }}"
                    placeholder="Skin Thickness" 
                    required
                  >

                  <input 
                    type="number" 
                    name="Insulin" 
                    value="{{ Insulin if Insulin else '' }}"
                    placeholder="Insulin" 
                    required
                  >

                  <input 
                    type="number" 
                    step="0.1" 
                    name="BMI" 
                    value="{{ BMI if BMI else '' }}"
                    placeholder="BMI" 
                    required
                  >

                  <input 
                    type="number" 
                    step="0.001" 
                    name="DiabetesPedigreeFunction" 
                    value="{{ DiabetesPedigreeFunction if DiabetesPedigreeFunction else '' }}"
                    placeholder="DPF" 
                    required
                  >

                  <input 
                    type="number" 
                    name="Age" 
                    value="{{ Age if Age else '' }}"
                    placeholder="Age" 
                    required
                  >

              </div>

              <div class="buttons">

                  <button type="submit" class="predict-btn">
                      Predict
                  </button>

                  <a href="/clear" class="clear-btn">
                      Clear
                  </a>

              </div>

          </form>

          {% if result %}
              <div class="result">
                  <h3>{{ result }}</h3>
                  <p>Confidence: {{ confidence }}%</p>
              </div>
          {% endif %}

      </div>

  </div>

</body>
</html>
